task: block_training
source_path: /path/to/your/dataset  # 需要设置为实际数据集路径
exp_name: street_gaussian_blocks
to_cuda: true

data:
  split_test: -1
  split_train: 1
  type: Waymo  # 或 Colmap, Blender
  white_background: false
  selected_frames: null
  cameras: null
  extent: 20  # 适合大场景的更大范围
  use_colmap: true
  filter_colmap: true
  box_scale: 1.5

model:
  gaussian:
    sh_degree: 1
    fourier_dim: 5
    fourier_scale: 1.
    flip_prob: 0.2
  nsg:
    include_bkgd: true
    include_obj: true
    include_sky: false  # 分块训练时建议关闭天空，在聚合时处理
    opt_track: true
  sky:
    resolution: 1024
    white_background: false
  use_color_correction: false  # 分块训练时建议关闭
  use_pose_correction: false   # 分块训练时建议关闭

train:
  iterations: 15000  # 每个块的训练迭代次数，可以比原始训练少一些
  test_iterations: [5000, 10000, 15000]
  save_iterations: [15000]
  checkpoint_iterations: [15000]

optim:
  # 密化参数 - 针对分块训练优化
  prune_box_interval: 100
  densification_interval: 100
  densify_from_iter: 500
  densify_grad_threshold_bkgd: 0.0008  # 稍微增加阈值以减少高斯球数量
  densify_grad_abs_bkgd: true
  densify_grad_threshold_obj: 0.0003
  densify_grad_abs_obj: false
  densify_grad_threshold: 0.0003
  densify_until_iter: 12000  # 提前停止密化
  
  # 学习率参数
  feature_lr: 0.0025
  max_screen_size: 20
  min_opacity: 0.01  # 提高最小不透明度阈值
  opacity_lr: 0.05
  opacity_reset_interval: 3000
  percent_big_ws: 0.1
  percent_dense: 0.01
  position_lr_delay_mult: 0.01
  position_lr_final: 1.6e-06
  position_lr_init: 0.00016
  position_lr_max_steps: 15000
  rotation_lr: 0.001
  scaling_lr: 0.005
  semantic_lr: 0.01

  # 损失权重
  lambda_dssim: 0.2
  lambda_sky: 0.0  # 分块训练时不使用天空损失
  lambda_sky_scale: []
  lambda_mask: 0.1
  lambda_reg: 0.1
  lambda_depth_lidar: 0.1
  lambda_color_correction: 0.0  # 分块训练时关闭
  lambda_l1: 1.0

  # 跟踪参数（针对动态对象）
  track_position_lr_delay_mult: 0.2
  track_position_lr_init: 0.0005
  track_position_lr_final: 0.0001
  track_position_max_steps: 15000

  track_rotation_lr_delay_mult: 0.5
  track_rotation_lr_init: 0.00001
  track_rotation_lr_final: 0.000005
  track_rotation_max_steps: 15000

render:
  fps: 24
  concat_cameras: [1, 0, 2]
  scaling_modifier: 1.0
  convert_SHs_python: false
  compute_cov3D_python: false
  render_normal: false

# 分块训练特定配置
block_training:
  # 自动分块参数
  auto_block_size: 50.0  # 每个块的大小（米）
  overlap_margin: 5.0    # 重叠边界宽度（米）
  
  # 聚合参数
  spatial_threshold: 0.15    # 空间去重阈值（米）
  opacity_threshold: 0.1     # 不透明度阈值
  overlap_threshold: 0.5     # 重叠阈值
  
  # 并行训练配置（如果支持）
  parallel_blocks: false     # 是否并行训练多个块
  max_parallel_jobs: 4       # 最大并行任务数
  
  # 内存管理
  clear_cache_between_blocks: true  # 块间清理缓存
  max_gaussians_per_block: 500000   # 每个块最大高斯球数量限制