task: "chunked_training"
source_path: ???  # 数据集路径
exp_name: "chunked_experiment"
to_cuda: true

# 分块训练特定参数
chunk:
  chunk_size: 5                    # 每个块的帧数
  overlap_size: 1                  # 相邻块之间的重叠帧数
  min_chunk_frames: 3              # 最小块大小
  max_memory_usage: 0.8            # 最大显存使用率
  enable_chunk_pruning: true       # 是否在块训练后进行剪枝
  chunk_prune_ratio: 0.2          # 块剪枝比例

# 贡献度评估参数
contribution:
  evaluation_method: "hybrid"      # 评估方法: gradient_based, visibility_based, hybrid
  num_evaluation_frames: 10       # 用于评估的帧数
  contribution_threshold: 0.01    # 贡献度阈值
  gradient_weight: 0.6            # 梯度评分权重(hybrid模式)
  visibility_weight: 0.4          # 可见性评分权重(hybrid模式)

# 场景拼接参数
stitching:
  overlap_threshold: 0.1           # 重叠检测阈值(米)
  similarity_threshold: 0.05      # 相似高斯基元检测阈值
  blend_region_size: 0.3          # 混合区域大小
  merge_similar_gaussians: true   # 是否合并相似的高斯基元
  remove_duplicates: true         # 是否移除重复的高斯基元
  final_prune_ratio: 0.3          # 最终剪枝比例

# 数据参数
data:
  split_test: -1
  split_train: 1
  type: "Waymo"                    # 数据集类型
  white_background: false
  selected_frames: ???
  cameras: ???
  extent: 10
  use_colmap: true
  filter_colmap: true
  box_scale: 1.5

# 模型参数
model:
  gaussian:
    sh_degree: 1
    fourier_dim: 5
    fourier_scale: 1.
    flip_prob: 0.2
  nsg:
    include_bkgd: true
    include_obj: true
    include_sky: true
    opt_track: true
  use_color_correction: false      # 分块训练中暂时禁用颜色校正
  use_pose_correction: false      # 分块训练中暂时禁用姿态校正
  sky:
    resolution: 1024
    white_background: ???

# 训练参数（针对分块训练调整）
train:
  iterations: 15000                # 每个块的迭代数（原来的一半）
  test_iterations: [7000, 15000]
  save_iterations: [15000]
  checkpoint_iterations: [5000, 10000, 15000]

# 优化参数
optim:
  # 密集化参数
  prune_box_interval: 100
  densification_interval: 100
  densify_from_iter: 500
  densify_grad_threshold_bkgd: 0.0008  # 略高于原来，减少过密集化
  densify_grad_abs_bkgd: True
  densify_grad_threshold_obj: 0.0003   # 略高于原来
  densify_grad_abs_obj: False
  densify_grad_threshold: 0.0003
  densify_until_iter: 12000           # 提前结束密集化
  
  # 学习率参数
  feature_lr: 0.0025
  max_screen_size: 20
  min_opacity: 0.01                   # 略高的最小不透明度
  opacity_lr: 0.05
  opacity_reset_interval: 3000
  percent_big_ws: 0.1
  percent_dense: 0.01
  position_lr_delay_mult: 0.01
  position_lr_final: 1.6e-06
  position_lr_init: 0.00016
  position_lr_max_steps: 15000       # 调整到块迭代数
  rotation_lr: 0.001
  scaling_lr: 0.005
  semantic_lr: 0.01

  # 损失权重
  lambda_l1: 1.0
  lambda_dssim: 0.2
  lambda_sky: 0.05
  lambda_sky_scale: []
  lambda_mask: 0.1
  lambda_reg: 0.1
  lambda_depth_lidar: 0.1
  lambda_color_correction: 0.0       # 分块训练中禁用

  # 轨迹优化参数
  track_position_lr_delay_mult: 0.2
  track_position_lr_init: 0.0005
  track_position_lr_final: 0.0001
  track_position_max_steps: 15000

  track_rotation_lr_delay_mult: 0.5
  track_rotation_lr_init: 0.00001
  track_rotation_lr_final: 0.000005
  track_rotation_max_steps: 15000

# 渲染参数
render:
  fps: 24
  concat_cameras: [1, 0, 2]

# 内存管理
memory:
  enable_gradient_checkpointing: true  # 启用梯度检查点
  enable_mixed_precision: false       # 是否使用混合精度
  clear_cache_frequency: 1000         # 清理缓存的频率
  max_chunk_gaussians: 100000         # 每个块最大高斯基元数量